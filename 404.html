html,body{margin:0;min-height:100%;background:var(--negro);color:var(--hueso)}

p{margin:0;max-width:52ch;font:400 12px/1.7 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.btn{justify-self:start;display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border:1px solid var(--hueso);background:var(--hueso);color:var(--negro);font:400 11px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;transition:background .2s,color .2s}
.btn:hover,.btn:focus-visible{background:transparent;color:var(--hueso);outline:none}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;border-top:1px solid var(--line);padding-top:16px;font:400 10px/1.6 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
footer a{color:inherit}
